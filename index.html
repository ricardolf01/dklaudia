function ped(id){const p=D.prods.find(x=>x.id==id);A.e=JSON.parse(JSON.stringify(p));A.e.szt=Object.entries(p.sz).map(([k,v])=>k+':'+v).join(', ');A.e.clt=p.cl.join(', ');admin()}
const plist=()=>`<button class="btn" ${E(function(event){A.e=newp();admin()})}>+ Novo produto</button>${D.prods.map(p=>`<div class="row"><div class="rt" ${p.ph[0]?`style="background-image:url(${RES(p.ph[0])})"`:''}></div><div class="rb"><b>${H(p.n)}</b><small>${H(catn(p.c))} · ${R(cur(p))} · estoque ${stk(p)}${p.st?'':' · inativo'}</small></div><button class="va" ${E(function(event){ped(p.id)})}>Editar</button><button class="va x" ${E(function(event){del('p',p.id)})}>Excluir</button></div>`).join('')||'<p class="em">Nenhum produto cadastrado.</p>'}`;
const pform=()=>{const e=A.e,ck=(i,l,v)=>`<label class="ck"><input type="checkbox" id="${i}" ${v?'checked':''}>${l}</label>`;return `<div class="fm"><h3>${e.n?'Editar':'Novo'} produto</h3><label>Nome</label><input id="fn" value="${H(e.n)}"><label>Categoria</label><select id="fc">${D.cats.map(c=>`<option value="${c.id}" ${c.id==e.c?'selected':''}>${H(c.n)}</option>`).join('')}</select><label>Preço (R$)</label><input id="fp" type="number" step=".01" inputmode="decimal" value="${e.p||''}"><label>Preço promocional (opcional — ativa a etiqueta Promoção)</label><input id="fq" type="number" step=".01" inputmode="decimal" value="${e.pp||''}"><label>Descrição</label><textarea id="fd" rows="4">${H(e.d)}</textarea><label>Informações do produto (composição, lavagem...)</label><textarea id="fi" rows="3">${H(e.i)}</textarea><label>Tabela de medidas (opcional)</label><textarea id="fmm" rows="3">${H(e.m)}</textarea><label>Tamanhos e estoque (ex: P:3, M:0, G:5)</label><input id="fs" value="${H(e.szt)}"><label>Cores (separadas por vírgula, opcional)</label><input id="fl" value="${H(e.clt)}"><label>Status</label><select id="ft"><option value="1">Ativo</option><option value="0" ${e.st?'':'selected'}>Inativo</option></select><label>Marcar como</label>${ck('k1','Novo',e.fl.nv)}${ck('k2','Lançamento',e.fl.lc)}${ck('k3','Mais vendido',e.fl.mv)}<label>Fotos (a primeira é a capa)</label>${e.ph.map((u,i)=>`<div class="pt" style="background-image:url(${RES(u)})"><button ${E(function(event){grab();A.e.ph.splice(i,1);admin()})}>✕</button></div>`).join('')}<input type="file" accept="image/*" multiple ${E(function(event){addPh(this)},'change')}><button class="btn" ${E(function(event){psave()})}>Salvar produto</button><button class="btn gh" ${E(function(event){A.e=null;admin()})}>Cancelar</button></div>`};
function grab(){const e=A.e,v=i=>$('#'+i).value;e.n=v('fn');e.c=v('fc');e.p=+v('fp')||0;e.pp=+v('fq')||0;e.d=v('fd');e.i=v('fi');e.m=v('fmm');e.szt=v('fs');e.clt=v('fl');e.st=+v('ft');e.fl={nv:+$('#k1').checked,lc:+$('#k2').checked,mv:+$('#k3').checked}}
function addPh(i){grab();[...i.files].forEach(f=>img(f,800,async u=>{const p=await up(u);if(p){A.e.ph.push(p);admin()}}))}
function psave(){grab();const e=A.e;if(!e.n.trim()||!e.p)return toast('Informe nome e preço');
 const q=JSON.parse(JSON.stringify(e));q.sz={};e.szt.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{const[k,v]=s.split(':');q.sz[k.trim().toUpperCase()]=v==null?1:Math.max(0,parseInt(v)||0)});
 if(!Object.keys(q.sz).length)q.sz={'ÚNICO':1};
 q.cl=e.clt.split(',').map(s=>s.trim()).filter(Boolean);delete q.szt;delete q.clt;
 const i=D.prods.findIndex(x=>x.id==q.id);i<0?D.prods.unshift(q):D.prods[i]=q;save(()=>A.e=null)}
/* categorias */
const clist=()=>`<div class="row"><input id="nc" placeholder="Nova categoria"><button class="va" ${E(function(event){csv()})}>Adicionar</button></div>${D.cats.map(c=>`<div class="row"><input id="c_${c.id}" value="${H(c.n)}"><button class="va" ${E(function(event){csv(c.id)})}>Salvar</button><button class="va x" ${E(function(event){del('c',c.id)})}>Excluir</button></div>`).join('')}`;
function csv(id){const v=$(id?'#c_'+id:'#nc').value.trim();if(!v)return;id?D.cats.find(c=>c.id==id).n=v:D.cats.push({id:nid('c'),n:v});save()}
/* banners */
const RT=()=>[['s/nv','Novidades'],['s/lc','Lançamentos'],['s/mv','Mais Vendidos'],['s/pm','Promoções'],['s/all','Todos os produtos'],...D.cats.map(c=>['c/'+c.id,c.n])];
const blist=()=>`<button class="btn" ${E(function(){A.b={id:nid('b'),t:'',s:'',bb:'',img:'',cat:'s/nv'};admin()})}>+ Novo banner</button>${D.bans.map(b=>`<div class="row"><div class="rt" ${b.img?`style="background-image:url(${RES(b.img)})"`:''}></div><div class="rb"><b>${H(b.t||'(sem título)')}</b><small>${H(b.s)}</small></div><button class="va" ${E(function(){A.b=JSON.parse(JSON.stringify(b));admin()})}>Editar</button><button class="va x" ${E(function(){del('b',b.id)})}>Excluir</button></div>`).join('')}`;
const gb=()=>{const b=A.b;b.t=$('#bt').value;b.s=$('#bs').value;b.bb=$('#bb').value;b.cat=$('#bk').value};
const bform=()=>{const b=A.b;return `<div class="fm"><h3>Banner</h3><label>Título</label><input id="bt" value="${H(b.t)}"><label>Texto</label><input id="bs" value="${H(b.s)}"><label>Texto do botão (vazio = sem botão)</label><input id="bb" value="${H(b.bb)}"><label>Ao tocar no banner, abrir</label><select id="bk"><option value="">Nada</option>${RT().map(([v,t])=>`<option value="${v}" ${v==b.cat?'selected':''}>${H(t)}</option>`).join('')}</select><label>Imagem (formato 16:9; sem imagem usa o fundo bege)</label>${b.img?`<div class="pt" style="width:160px;height:90px;background-image:url(${RES(b.img)})"><button ${E(function(){gb();A.b.img='';admin()})}>✕</button></div>`:''}<input type="file" accept="image/*" ${E(function(){gb();img(this.files[0],1200,async u=>{const p=await up(u);if(p){A.b.img=p;admin()}})},'change')}><button class="btn" ${E(bsv)}>Salvar banner</button><button class="btn gh" ${E(function(){A.b=null;admin()})}>Cancelar</button></div>`};
function bsv(){gb();const i=D.bans.findIndex(x=>x.id==A.b.id);i<0?D.bans.push(A.b):D.bans[i]=A.b;save(()=>A.b=null)}
/* configurações */
const F=[['wa','WhatsApp da loja (com DDI e DDD, ex: 5591999999999)'],['mq','Texto da faixa no topo (vazio = esconder)'],['desc','Descrição da loja (rodapé e Google)'],['par','Parcelas sem juros (x)'],['ig','Instagram (sem @)'],['addr','Endereço (opcional)'],['h1','Horário (linha 1)'],['h2','Horário (linha 2)']];
const sform=()=>`<div class="fm">${TK&&!NEEDTK?'':`<div class="inf"><b>Ativar salvamento (só 1ª vez)</b><span>Cole o token do GitHub abaixo. Depois disso, este aviso some e qualquer aparelho edita só com a senha.<br>Este site usa o repositório <b>${(GH()||['?']).join('/')}</b>: o token precisa ser desse repositório.</span></div><input id="tk" type="password" placeholder="github_pat_..." style="margin-top:10px"><button class="btn" ${E(conn)}>Ativar salvamento</button><div id="dg" style="margin-top:10px;font-size:12px;color:var(--mut);word-break:break-word"></div>`}<label>Logo (opcional; sem logo aparece o nome em letras)</label>${D.cfg.logo?`<div class="pt" style="width:120px;height:60px;background-color:#fff;background-size:contain;background-repeat:no-repeat;background-image:url(${RES(D.cfg.logo)})"><button ${E(function(){gc();D.cfg.logo='';admin()})}>✕</button></div>`:''}<input type="file" accept="image/*" ${E(function(){gc();img(this.files[0],500,async u=>{const p=await up(u);if(p){D.cfg.logo=p;admin()}})},'change')}>${F.map(([k,t])=>`<label>${t}</label><input id="s_${k}" value="${H(D.cfg[k])}">`).join('')}<button class="btn" ${E(function(event){ssv()})}>Salvar configurações</button></div>`;
const gc=()=>{F.forEach(([k])=>{const e=$('#s_'+k);if(e){const v=e.value.trim();D.cfg[k]=k=='par'?Math.max(1,parseInt(v)||3):v}})};
function ssv(){gc();save()}

addEventListener('hashchange',()=>{go();scrollTo(0,0)});(async()=>{SNAP=JSON.stringify(D);try{const r=await Promise.race([fetch('dados.json?t='+Date.now()),new Promise((_,j)=>setTimeout(j,4000))]);if(r.ok){const d=await r.json();if(d&&d.prods){D=d;SNAP=JSON.stringify(D)}}}catch(e){}norm();SNAP=JSON.stringify(D);init()})();
</script></body></html>
